  <h3>Edzésnapok</h3><div class="grid2">${DAYS.map((d,i)=>`<label class="lbl">${d.name}<select class="in" data-set="day${i}">${[1,2,3,4,5,6,0].map(w=>`<option value="${w}" ${s.days[i]===w?'selected':''}>${WD[w]}</option>`).join('')}</select></label>`).join('')}</div>
  <button class="btn ghost full" data-a="newCycle">Új ciklus indítása ettől a héttől</button>
  <h3>Napi követés</h3><label class="lbl">Kreatin adag (g)<input class="in" inputmode="decimal" data-set="creatine" value="${num(s.creatine)}"></label>
  <label class="sw"><input type="checkbox" data-set="water" ${s.water?'checked':''}> Vízfogyasztás követése</label>
  <label class="lbl">Napi vízcél (ml)<input class="in" inputmode="numeric" data-set="waterGoal" value="${s.waterGoal}"></label>
  <label class="sw"><input type="checkbox" data-set="sleep" ${s.sleep?'checked':''}> Alvás követése</label>
  <h3>Megjelenés</h3>${sel('theme',[['blue','NOCTA kék'],['dark','NOCTA fekete'],['light','Világos'],['system','A telefon beállítása szerint']])}
  ${STANDALONE?`<h3>Spotify</h3><p class="meta">A napi playlisthez egyszer létre kell hoznod egy ingyenes Spotify Developer appot (developer.spotify.com/dashboard). Ott a Redirect URI legyen pontosan ez:</p><div class="last" style="user-select:all;word-break:break-all">${esc(redirectUri())}</div><label class="lbl">Client ID<input class="in" data-set="spClientId" value="${esc(s.spClientId||'')}" placeholder="a Developer app Client ID-ja" autocomplete="off"></label>${spLinked()?'<p class="meta">Összekötve.</p><button class="btn ghost full" data-a="spLogout">Spotify leválasztása</button>':(s.spClientId?'<button class="btn acc full" data-a="spLogin">Spotify összekötése</button>':'')}`:''}
  <h3>Adatok</h3><p class="meta">${sync==='cloud'?'Az adataid a claude.ai fiókodba is mentődnek, így másik eszközön is megmaradnak.':'Az adataid ezen az eszközön tárolódnak. Készíts néha mentést fájlba.'} A mentéssel át tudod vinni az adataidat a claude.ai-os és a telepített verzió között.</p>
  <div class="btn-row"><button class="btn ghost" data-a="export">Mentés fájlba</button><button class="btn ghost" data-a="importPick">Visszatöltés</button></div><input type="file" id="impFile" accept=".json,application/json" hidden>
  <button class="btn ghost full danger" data-a="reset">${ui.resetArm?'Biztosan? Koppints újra a törléshez':'Minden adat törlése'}</button>`}
};
function openSheet(name){ui.sheet=name;renderSheet()}
function closeSheet(){ui.sheet=null;ui.resetArm=false;renderSheet()}
function renderSheet(keep){const w=$('#sheetWrap');if(!ui.sheet){w.hidden=true;w.innerHTML='';document.body.classList.remove('lock');return}
  const old=$('.sheet',w),sc=old?old.scrollTop:0;w.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${SHEETS[ui.sheet]()}</div>`;w.hidden=false;document.body.classList.add('lock');if(keep)$('.sheet',w).scrollTop=sc}

/* ---------- render ---------- */
const TABS=[['ma','Ma'],['edzes','Edzés'],['etel','Étel'],['prep','Prep'],['halad','Haladás']];
const VIEWS={ma:rMa,edzes:rEdzes,etel:rEtel,prep:rPrep,halad:rHalad};
function render(keep){checkRewards();const y=window.scrollY;$('#main').innerHTML=VIEWS[ui.tab]();$('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${ui.tab===k?'on':''}" data-a="tab" data-t="${k}" aria-current="${ui.tab===k?'page':'false'}"><span class="ic">${ICON[k]}</span><span>${l}</span></button>`).join('');try{window.scrollTo(0,keep?y:0)}catch(e){}}

/* ---------- rest timer ---------- */
let timer=null;
function startRest(sec){if(timer)clearInterval(timer.iv);timer={end:Date.now()+sec*1000,iv:setInterval(tick,250)};tick()}
function stopRest(){if(timer)clearInterval(timer.iv);timer=null;$('#rest').hidden=true}
function tick(){const el=$('#rest');if(!timer){el.hidden=true;return}const left=Math.max(0,Math.ceil((timer.end-Date.now())/1000));el.hidden=false;$('#restT').textContent=Math.floor(left/60)+':'+pad(left%60);
  if(left<=0){clearInterval(timer.iv);timer=null;$('#restT').textContent='Mehet';beep();setTimeout(()=>{if(!timer)el.hidden=true},2500)}}
let actx;function beep(){try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=0.15;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+0.25)}catch(e){}}

/* ---------- actions ---------- */
function readTE(){const t=ui.te,a=$('#teTitle'),b=$('#teDate'),c=$('#teTime');if(a)t.title=a.value;if(b)t.date=b.value;if(c)t.time=c.value}
function act(a,b){const t=dk(),d=b.dataset;
switch(a){
case 'tab':ui.tab=d.t;if(d.s)ui.prepSeg=d.s;render();break;
case 'seg':ui[d.k]=d.v;render(true);break;
case 'settings':openSheet('settings');break;
case 'close':closeSheet();break;
case 'goday':ui.tab='edzes';ui.day=d.d;render();break;
case 'creatine':if(S.creatine[t])delete S.creatine[t];else S.creatine[t]=true;save();render(true);break;
case 'creatineInfo':openSheet('creatine');break;
case 'supps':openSheet('supps');break;
case 'playlist':makePlaylist();break;
case 'spLogin':spLogin();break;
case 'spLogout':spSet({});renderSheet(true);render(true);toast('Spotify leválasztva');break;
case 'export':exportData();break;
case 'importPick':{const f=$('#impFile');if(f)f.click();break}
case 'sup':{const arr=S.supTaken[t]=S.supTaken[t]||[];const i=arr.indexOf(d.id);if(i>=0)arr.splice(i,1);else arr.push(d.id);save();render(true);break}
case 'water':S.water[t]=Math.max(0,(S.water[t]||0)+Number(d.v));save();render(true);break;
case 'task':{const arr=S.taskDone[t]=S.taskDone[t]||[];const i=arr.indexOf(d.id);if(i>=0)arr.splice(i,1);else arr.push(d.id);save();render(true);break}
case 'taskNew':ui.te={id:null,title:'',type:'daily',days:[new Date().getDay()],date:t,time:''};openSheet('task');break;
case 'taskEdit':{const k=S.tasks.find(x=>x.id===d.id);if(!k)break;ui.te=JSON.parse(JSON.stringify(k));ui.te.days=ui.te.days||[];ui.te.date=ui.te.date||t;openSheet('task');break}
case 'tasksManage':openSheet('tasks');break;
case 'teType':readTE();ui.te.type=d.v;renderSheet(true);break;
case 'teDay':{readTE();const w=Number(d.v),i=ui.te.days.indexOf(w);if(i>=0)ui.te.days.splice(i,1);else ui.te.days.push(w);renderSheet(true);break}
case 'teSave':{readTE();const te=ui.te;if(!te.title.trim()){toast('Írd be, mit szeretnél csinálni.');$('#teTitle').focus();break}if(te.type==='weekly'&&!te.days.length){toast('Válassz legalább egy napot.');break}
  const rec={id:te.id||uid(),title:te.title.trim(),type:te.type,days:te.type==='weekly'?te.days:[],date:te.type==='once'?(te.date||t):'',time:te.time||''};
  const i=S.tasks.findIndex(x=>x.id===rec.id);if(i>=0)S.tasks[i]=rec;else S.tasks.push(rec);save();closeSheet();render(true);toast('Teendő mentve');break}
case 'teDel':S.tasks=S.tasks.filter(x=>x.id!==ui.te.id);save();closeSheet();render(true);toast('Teendő törölve');break;
case 'day':ui.day=d.d;render();break;
case 'guide':ui.guide[d.ex]=!ui.guide[d.ex];render(true);break;
case 'swap':ui.sw={o:d.o,id:d.id};openSheet('swap');break;
case 'foodNew':ui.fe={id:null,n:'',kcal:null,p:null,c:null,s:null};openSheet('food');break;
case 'feBc':{const v=($('#feBc').value||'').replace(/\D/g,'');barcodeLookup(v);break}
case 'feSrv':readFE();ui.fe.g=ui.fe.per.srv;feCalc(ui.fe);renderSheet(true);break;
case 'foodEdit':{const x=((S.food||{})[t]||[]).find(y=>y.id===d.id);if(!x)break;ui.fe={...x};openSheet('food');break}
case 'feQuick':{const x=recentFoods()[Number(d.i)];if(x){readFE();Object.assign(ui.fe,{n:x.n,kcal:x.kcal,p:x.p,c:x.c,s:x.s});renderSheet(true)}break}
case 'feRecipe':{const r=RI[d.id];if(r){readFE();Object.assign(ui.fe,{n:r.n,kcal:r.kcal,p:r.p,c:r.ch});renderSheet(true)}break}
case 'feSave':{readFE();const e=ui.fe;if(!e.n.trim()){toast('Írd be, mit ettél.');$('#feN').focus();break}if(e.kcal==null||e.kcal<0||e.kcal>5000){toast('Add meg a kalóriát.');$('#feK').focus();break}
  const now=new Date();S.food=S.food||{};const L=S.food[t]=S.food[t]||[],rec={id:e.id||uid(),n:e.n.trim(),kcal:e.kcal,p:e.p,c:e.c,s:e.s,tm:e.tm||pad(now.getHours())+':'+pad(now.getMinutes())};
  const i=L.findIndex(x=>x.id===rec.id);if(i>=0)L[i]=rec;else L.push(rec);L.sort((a,b)=>a.tm.localeCompare(b.tm));save();closeSheet();render(true);toast('Étkezés mentve');break}
case 'feDel':S.food[t]=(S.food[t]||[]).filter(x=>x.id!==ui.fe.id);save();closeSheet();render(true);toast('Törölve');break;
case 'ateRecipe':{const r=RI[ui.rs.id],now=new Date();S.food=S.food||{};(S.food[t]=S.food[t]||[]).push({id:uid(),n:r.n,kcal:r.kcal,p:r.p,c:r.ch,s:null,tm:pad(now.getHours())+':'+pad(now.getMinutes())});S.food[t].sort((a,b)=>a.tm.localeCompare(b.tm));save();render(true);toast('Hozzáadva a mai naplóhoz');break}
case 'swapTo':{const o=ui.sw.o;S.swaps=S.swaps||{};if(d.id===o)delete S.swaps[o];else S.swaps[o]=d.id;save();closeSheet();render(true);toast(d.id===o?'Visszaállítva':'Csere mentve: '+EX[d.id].n);break}
case 'ch':S.chDone=S.chDone||{};if(S.chDone[t])delete S.chDone[t];else{S.chDone[t]=true;toast('Kihívás teljesítve, +30 XP')}save();render(true);break;
case 'wx':wx.err=false;render(true);loadWx(true);break;
case 'set':{const id=d.ex,i=Number(d.i),L=ensureLog(id),s=L[i],ex=EX[id];s[2]=!s[2];if(s[2]&&s[1]==null)s[1]=ex.r[1];save();
  if(s[2])startRest(ex.rest);
  if(s[2]&&ex.inc&&ex.u!=='mp'&&ex.u!=='testsúly'&&L.every(x=>x[2]&&(x[1]||0)>=ex.r[1]))toast(ex.n+': legközelebb +'+num(ex.inc)+' kg!');
  const ci=cycleInfo(),day=DAYS.find(x=>x.id===ui.day);
  if(s[2]&&day&&!S.sessions[t]&&exList(day,ci).every(exDone)){S.sessions[t]=day.id;save();stopRest();toast('Edzés kész, szép munka!')}
  render(true);break}
case 'finish':if(S.sessions[t]===d.d){delete S.sessions[t];toast('Visszavonva')}else{S.sessions[t]=d.d;stopRest();toast('Edzés kész, szép munka!')}save();render(true);break;
case 'rest30':if(timer)timer.end+=30000;tick();break;
case 'restSkip':stopRest();break;
case 'reroll':{const wk=weekKey();S.reroll[wk]=(S.reroll[wk]||0)+1;if(S.plan)delete S.plan[wk];save();render(true);break}
case 'pl':{const{p}=weekPlan();p[d.id]=Math.max(0,Math.min(20,(p[d.id]||0)+Number(d.v)));save();render(true);break}
case 'listToShop':{const{picks,p}=weekPlan();picks.filter(r=>p[r.id]>0).forEach(r=>addShop(r,p[r.id]));ui.foodSeg='shop';render(true);toast('Hozzáadva a bevásárlólistához');break}
case 'recipe':ui.rs={id:d.id,sv:RI[d.id].base};openSheet('recipe');break;
case 'sv':ui.rs.sv=Math.max(1,Math.min(16,ui.rs.sv+Number(d.v)));renderSheet(true);break;
case 'toShop':addShop(RI[ui.rs.id],ui.rs.sv);toast('Hozzáadva a bevásárlólistához');render(true);break;
case 'toPrep':ui.prep.r=ui.rs.id;ui.tab='prep';ui.prepSeg='plan';closeSheet();render();break;
case 'fav':{const id=ui.rs.id,i=S.fav.indexOf(id);if(i>=0)S.fav.splice(i,1);else{S.fav.push(id);S.hidden=S.hidden.filter(x=>x!==id)}save();renderSheet(true);render(true);break}
case 'hide':{const id=ui.rs.id,i=S.hidden.indexOf(id);if(i>=0)S.hidden.splice(i,1);else{S.hidden.push(id);S.fav=S.fav.filter(x=>x!==id)}save();renderSheet(true);render(true);break}
case 'shopItem':{const x=S.shop[Number(d.i)];if(x){x.c=!x.c;save();render(true)}break}
case 'shopClearDone':S.shop=S.shop.filter(x=>!x.c);save();render(true);break;
case 'shopClearAll':S.shop=[];save();render(true);break;
case 'pd':ui.prep.days=Math.max(1,Math.min(14,ui.prep.days+Number(d.v)));render(true);break;
case 'pp':ui.prep.per=Math.max(1,Math.min(4,ui.prep.per+Number(d.v)));render(true);break;
case 'prepShop':{const r=RI[ui.prep.r],P=prepCalc(r,ui.prep.days,ui.prep.per);addShop(r,P.total);toast('Hozzáadva a bevásárlólistához');break}
case 'prepCook':{const r=RI[ui.prep.r],P=prepCalc(r,ui.prep.days,ui.prep.per),now=Date.now();
  if(P.fridge)S.inventory.push({id:uid(),r:r.id,loc:'fridge',n:P.fridge,made:now,exp:now+r.fd*DAY});
  if(P.freezer)S.inventory.push({id:uid(),r:r.id,loc:'freezer',n:P.freezer,made:now,exp:now+(r.fm||2)*30*DAY});
  save();ui.prepSeg='inv';render();toast(P.total+' adag a készletben');break}
case 'eat':{const it=S.inventory.find(x=>x.id===d.id);if(it){it.n--;if(it.n<=0)S.inventory=S.inventory.filter(x=>x!==it);save();render(true);toast('Jó étvágyat!')}break}
case 'thaw':{const it=S.inventory.find(x=>x.id===d.id);if(it){it.n--;if(it.n<=0)S.inventory=S.inventory.filter(x=>x!==it);const now=Date.now();S.inventory.push({id:uid(),r:it.r,loc:'fridge',n:1,made:it.made,exp:now+1.5*DAY,thawed:true});save();render(true);toast('1 adag átkerült a hűtőbe')}break}
case 'invDel':S.inventory=S.inventory.filter(x=>x.id!==d.id);save();render(true);break;
case 'addW':{const v=pnum($('#wIn').value);if(!v||v<30||v>250){toast('Adj meg egy érvényes súlyt.');break}const i=S.weights.findIndex(x=>x[0]===t);if(i>=0)S.weights[i][1]=v;else S.weights.push([t,v]);S.weights.sort((a,b)=>a[0].localeCompare(b[0]));save();render(true);toast('Súly mentve');break}
case 'delW':S.weights=S.weights.filter(x=>x[0]!==d.d);save();render(true);break;
case 'newCycle':S.settings.planStart=dk(monday(new Date()));save();render(true);toast('Új ciklus indult');break;
case 'reset':if(!ui.resetArm){ui.resetArm=true;renderSheet(true);break}S=defaults();save();applyTheme();ui.resetArm=false;closeSheet();ui.tab='ma';render();toast('Minden adat törölve');break;
}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;act(b.dataset.a,b)});
document.addEventListener('change',e=>{const el=e.target,t=dk();
  if(el.dataset.in){const k=el.dataset.in;
    if(k==='kg'||k==='reps'){const L=ensureLog(el.dataset.ex),i=Number(el.dataset.i);let v=pnum(el.value);if(k==='reps'&&v!=null)v=Math.round(v);L[i][k==='kg'?0:1]=v;save()}
    else if(k==='sleep'){const v=pnum(el.value);if(v==null)delete S.sleep[t];else S.sleep[t]=v;save()}
    else if(k==='prepR'){ui.prep.r=el.value;render(true)}
    else if(k==='exChart'){ui.exChart=el.value;render(true)}}
  if(el.dataset.sup){S.settings.supps[el.dataset.sup]=el.checked;save();render(true)}
  if(el.dataset.set){const k=el.dataset.set,s=S.settings;
    if(k.startsWith('day'))s.days[Number(k.slice(3))]=Number(el.value);
    else if(el.type==='checkbox')s[k]=el.checked;
    else if(k==='theme'||k==='sex'||k==='name'||k==='spClientId')s[k]=el.value.trim();
    else if(k==='goalWeight')s[k]=pnum(el.value);
    else{const v=pnum(el.value);if(v!=null)s[k]=v}
    save();applyTheme();ui.day=null;render(true);if(k==='spClientId'&&ui.sheet)renderSheet(true)}
  if(el.id==='impFile'&&el.files&&el.files[0])importData(el.files[0]);
  if(el.id==='feImg'&&el.files&&el.files[0])scanFood(el.files[0]);});
document.addEventListener('input',e=>{if(e.target.id!=='feG'||!ui.fe||!ui.fe.per)return;readFE();feCalc(ui.fe);const f=(id,v)=>{const x=$('#'+id);if(x)x.value=num(v)};f('feK',ui.fe.kcal);f('feP',ui.fe.p);f('feC',ui.fe.c);f('feS',ui.fe.s)});
$('#sheetWrap').addEventListener('click',e=>{if(e.target.id==='sheetWrap')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sheet)closeSheet()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!ui.sheet&&!(document.activeElement&&document.activeElement.matches('input,select')))render(true)});

applyTheme();render();initDb();initMcp();spHandleRedirect();loadWx();
let lastDay=dk();
setInterval(()=>{const busy=ui.sheet||(document.activeElement&&document.activeElement.matches('input,select,textarea'));if(busy||document.visibilityState!=='visible')return;loadWx();if(dk()!==lastDay){lastDay=dk();ui.day=null;render(true);return}if(ui.tab==='ma'||ui.tab==='halad')render(true)},60000);
if('serviceWorker' in navigator&&!window.claude&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
